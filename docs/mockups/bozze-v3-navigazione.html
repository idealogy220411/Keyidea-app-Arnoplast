<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barra di navigazione · bozza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E30613; --brand-dark:#C00510; --brand-soft:#FDF0F1; --ink:#231F20;
  --bg:#F4F4F5; --card:#FFFFFF; --muted:#6E6A6B; --line:#E7E5E5;
  --page:#EDEDEE; --page-text:#231F20; --page-muted:#5E5A5B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#151414; --page-text:#EDEBEB; --page-muted:#A8A3A4; }
}
:root[data-theme="dark"]{ --page:#151414; --page-text:#EDEBEB; --page-muted:#A8A3A4; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--page-text);font-family:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:32px 16px 64px}
.intro{max-width:760px;margin:0 auto 32px}
.intro h1{font-size:24px;font-weight:900;margin-bottom:8px}
.intro p{color:var(--page-muted);font-size:15px;line-height:1.55}
.intro .tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--brand);color:#fff;border-radius:6px;padding:3px 8px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:40px;max-width:1200px;margin:0 auto}

.phone{width:320px;height:660px;border-radius:46px;background:#111;padding:10px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:14px}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:86px;height:25px;background:#000;border-radius:18px;z-index:20}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 24px 0 28px;font-weight:700;font-size:13px}
.status svg{height:11px}
.scroll{flex:1;overflow:hidden}
.pad{padding:0 16px}
.homeind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:5px;border-radius:3px;background:var(--ink);z-index:30}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.logo{display:flex;align-items:center}
.logo-real{width:150px;height:28px;display:block}
.pill{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:0 12px;color:#9A9596;font-size:14px;margin:4px 0 16px}
.search svg{width:16px;height:16px}
.sec{font-size:19px;font-weight:900;margin:4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.thumb{aspect-ratio:4/3;background:linear-gradient(160deg,#EEF0F1,#E2E5E6);display:flex;align-items:center;justify-content:center;color:#B9BEC0}
.thumb svg{width:44%;height:52%}
.card .meta{padding:8px 10px 10px}
.card .name{font-size:12.5px;font-weight:900}
.card .sub{font-size:11px;color:var(--muted);margin-top:1px}

.tabbar{flex:none;display:flex;align-items:center;background:var(--brand);padding:20px 2px 22px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.62)}
.tab svg{width:33px;height:33px}
.tab.on{color:#fff}

.closeup{width:320px;background:#fff;border-radius:20px;padding:14px 10px 24px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.closeup .tabbar{border-radius:14px;padding:20px 2px 16px}
.closeup .tab{font-size:12.5px}
.closeup .tab svg{width:33px;height:33px}
.cap{text-align:center;color:var(--page-muted);font-size:12.5px;margin-top:12px}
figcaption{margin-top:14px;font-size:13.5px;color:var(--page-muted);text-align:center;max-width:320px}
figcaption b{display:block;color:var(--page-text);font-weight:900;margin-bottom:2px}
</style>
</head>
